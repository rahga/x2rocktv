name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; move on purpose, not by surprise.
    runs-on: ubuntu-24.04
    steps:
      # Whole history and tags: the version is `git describe`'s, and a shallow clone has no tag to
      # describe from, so every CI build was 0.0.0-dev and the check below never saw a real name (P-123).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # :app needs a platform to compile against; :core does not. v3's default package list
      # included `tools`, which the runner's SDK manager no longer has: every run from 2026-10-06
      # failed here, before any test ran. v4 installs platform-tools only; Gradle fetches the
      # platform it needs.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # No Sonos credentials, no speakers, no device. The transport is tested against
      # FakePlayer, which is the point of it existing — see core/src/testFixtures/.../FakePlayer.kt.
      - name: Test
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug

      # The public release configuration, as a tester's APK and Play's bundle are made: R8 shrinking
      # on, no private inputs. No release key here, so it signs with the debug key, and no speaker
      # salt, so it reads no stored sign-ins; neither changes what is checked (T-34).
      - name: Release build and lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease

      - name: The public APK is not a private build
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          name=$("$aapt2" dump badging "$apk" | grep -o "versionName='[^']*'")
          echo "$name"
          if grep -q hardcore <<<"$name"; then echo "the public APK is marked +hardcore"; exit 1; fi
          if grep -q "0.0.0-dev" <<<"$name"; then echo "the APK carries no version: git describe found no tag"; exit 1; fi
          # What the "+hardcore" mark stands for, read off the build itself: the version name is only
          # set from the same flags, so it could not fail on its own (P-68). Any integration key or
          # secret compiled in is a value here.
          config=app/build/generated/source/buildConfig/release/com/rahga/x2rock/BuildConfig.java
          if grep -E 'SONOS_(KEY|SECRET) = "[^"]+"' "$config"; then echo "the public build carries an integration"; exit 1; fi

      # P-47: a build with the developer integration must refuse to write a bundle, however the bundle
      # is asked for. Dummy key files, never real ones; an abbreviated task name, as the bypass was.
      - name: A private bundle is refused
        run: |
          printf 'dummy-key\n' > "$RUNNER_TEMP/key"; printf 'dummy-secret\n' > "$RUNNER_TEMP/secret"
          if ./gradlew --no-daemon :app:bR -Px2rock.sonosIntegration \
              -Px2rock.sonosKeyFile="$RUNNER_TEMP/key" -Px2rock.sonosSecretFile="$RUNNER_TEMP/secret" > guard.log 2>&1; then
            cat guard.log; echo "a bundle was built with private inputs"; exit 1
          fi
          grep -q "a bundle must not carry private inputs" guard.log || { cat guard.log; echo "failed, but not on the guard"; exit 1; }
          echo "refused, as it should be"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            guard.log
