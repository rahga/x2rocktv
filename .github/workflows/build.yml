name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # :app needs a platform to compile against; :core does not. The action's default package
      # list includes `tools`, which the runner's current SDK manager no longer has: every run
      # from 2026-10-06 failed here, before any test ran. Gradle fetches the platform it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # No Sonos credentials, no speakers, no device. The transport is tested against
      # FakePlayer, which is the point of it existing — see core/src/testFixtures/.../FakePlayer.kt.
      - name: Test
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
